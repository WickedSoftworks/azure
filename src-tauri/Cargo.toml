[workspace]
members = ["crates/*"]

[package]
name = "azure"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "azure_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
azure-color = { path = "crates/azure-color" }
azure-display = { path = "crates/azure-display" }
azure-settings = { path = "crates/azure-settings" }
azure-scan = { path = "crates/azure-scan" }
ts-rs = "12"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Deliberately NOT panic = "abort", which the Tauri template ships. Azure
# holds display state that only its own Drop impls put back, so a panic has
# to unwind through them. A few KB of unwind tables against the chance of
# leaving someone on a dark or magenta screen is not a close call.
strip = true

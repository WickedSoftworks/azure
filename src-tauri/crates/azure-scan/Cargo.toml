[package]
name = "azure-scan"
version = "0.1.0"
edition = "2021"
description = "Finding installed games across the launchers that hold them."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Registry",
] }
